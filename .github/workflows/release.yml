name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets can't be read in an if:, so it is put here and the step checks env.
      STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Bundle
        run: ./scripts/bundle.sh "${GITHUB_REF_NAME}" "dist/repeatertastic-meshflow-${GITHUB_REF_NAME}.zip"
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

      # Ask the store to read this release and open its own pull request. It takes the checksum,
      # size, architectures and permissions out of the bundle, so nothing is typed by hand.
      # STORE_TOKEN needs actions:write on ScotMesh/repeatertastic-plugins; without it the release
      # still happens and the store is updated by hand.
      - name: Offer it to the store
        if: env.STORE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.STORE_TOKEN }}
        run: |
          gh workflow run add-release.yml -R ScotMesh/repeatertastic-plugins \
            -f repo="${GITHUB_REPOSITORY}" -f tag="${GITHUB_REF_NAME}"

  image:
    needs: bundle # only publish an image for a release whose tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7 # distroless has no arm/v6; Pi Zero uses the zip bundle
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/scotmesh/repeatertastic-meshflow:${{ github.ref_name }}
            ghcr.io/scotmesh/repeatertastic-meshflow:latest

name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Bundle
        run: ./scripts/bundle.sh "${GITHUB_REF_NAME}" "dist/repeatertastic-meshflow-${GITHUB_REF_NAME}.zip"
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

  image:
    needs: bundle # only publish an image for a release whose tests passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/scotmesh/repeatertastic-meshflow:${{ github.ref_name }}
            ghcr.io/scotmesh/repeatertastic-meshflow:latest

name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and test
        run: make test
      - name: Bundle
        run: ./scripts/bundle.sh ci-${GITHUB_SHA::7} dist/repeatertastic-meshflow.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repeatertastic-meshflow-bundle
          path: dist/repeatertastic-meshflow.zip
